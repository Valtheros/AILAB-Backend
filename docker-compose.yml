services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./dataset:/app/dataset
      - ./runs:/app/runs
      - ./storage:/app/storage
    environment:
      APP_BASE_DIR: /app
      STORAGE_DIR: /app/storage
      DATASET_DIR: /app/dataset
      RUNS_DIR: /app/runs
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://ailab:ailab_dev_password@postgres:5432/ailab
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cv_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: cv_worker
    shm_size: "8gb"
    volumes:
      - ./dataset:/app/dataset
      - ./runs:/app/runs
      - model_cache:/root/.cache
    environment:
      RUNS_DIR: /app/runs
      REDIS_URL: redis://redis:6379
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped

  ocr-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.ocr
    container_name: cv_ocr_worker
    shm_size: "8gb"
    volumes:
      - ./dataset:/app/dataset
      - ./runs:/app/runs
      - ocr_model_cache:/root/.cache
    environment:
      RUNS_DIR: /app/runs
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cv_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ailab
      POSTGRES_USER: ailab
      POSTGRES_PASSWORD: ailab_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rq-dashboard:
    image: eoranged/rq-dashboard:v0.6.3
    container_name: cv_rq_dashboard
    ports:
      - "127.0.0.1:9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  model_cache:
  ocr_model_cache:
