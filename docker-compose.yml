services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./dataset:/app/dataset
      - ./runs:/app/runs
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cv_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: cv_worker
    shm_size: "8gb"
    volumes:
      - ./dataset:/app/dataset
      - ./runs:/app/runs
      - model_cache:/root/.cache
    environment:
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped

  ocr-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.ocr
    container_name: cv_ocr_worker
    shm_size: "8gb"
    volumes:
      - ./dataset:/app/dataset
      - ./runs:/app/runs
      - ocr_model_cache:/root/.cache
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  rq-dashboard:
    image: eoranged/rq-dashboard:v0.6.3
    container_name: cv_rq_dashboard
    ports:
      - "127.0.0.1:9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  model_cache:
  ocr_model_cache:
